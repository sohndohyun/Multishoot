services:
  mysql:
    image: mysql:8.4.10
    ports:
      - "127.0.0.1:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: multishoot_root_dev
      MYSQL_DATABASE: multishoot
      MYSQL_USER: multishoot
      MYSQL_PASSWORD: multishoot_dev
    volumes:
      - multishoot_mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  multishoot_mysql_data:
